# lsr color configuration
#
# This file is read from the directory lsr is run in. If it is not present,
# these built-in defaults are used. Set LSR_CONFIG to load a file from another
# location.
#
# Accepted color values:
#   #RRGGBB or #RGB   truecolor hex
#   named color       black, red, green, yellow, blue, magenta, cyan, white
#                     and bright_black through bright_white
#   0-255             ANSI 256-color palette index
#   default           terminal default color (no coloring)

# Summary line ("Current directory storage: ...")
total = #5FB88F

# Directory names
directory = #7CC4FF

# Regular file names
file = default

# Progress bar: completed portion / remaining portion
progress_fill = bright_cyan
progress_empty = bright_blue
